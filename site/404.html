<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found | StayUp Social</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000538">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600&family=Josefin+Sans:wght@300&display=swap">
<style>
:root{--navy:#000538;--ice:#7FEFFF;--steel:#8A93C9;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy);color:#fff;font-family:'Inter',system-ui,sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(70vmax 70vmax at 15% -10%,rgba(31,63,255,.55),transparent 65%),radial-gradient(60vmax 60vmax at 110% 110%,rgba(18,216,250,.35),transparent 65%),var(--navy)}
main{width:min(520px,100%);text-align:center;padding:40px 28px;border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 60px -30px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7)}
img{height:40px;width:auto}
.label{display:block;margin-top:28px;font-family:'Josefin Sans',sans-serif;font-weight:300;font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--steel)}
h1{font-family:'Fredoka',system-ui,sans-serif;font-size:clamp(32px,7vw,48px);line-height:1.05;margin:10px 0 12px}
p{color:rgba(214,224,255,.78);line-height:1.6;margin:0 0 26px}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;text-decoration:none;color:#fff;font-weight:600;font-size:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08)}
a.btn.grad{border:0;background:linear-gradient(45deg,#12D8FA,#00A1FF,#1F3FFF)}
a.btn:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a href="/" aria-label="StayUp Social home"><img src="/logo/stayup-lockup.png" alt="StayUp Social" width="141" height="40"></a>
  <span class="label">Error 404</span>
  <h1>This page didn’t rise.</h1>
  <p>The link may be old or mistyped. Everything else is one tap away.</p>
  <nav>
    <a class="btn grad" href="/">Go home</a>
    <a class="btn" href="/services">Services</a>
    <a class="btn" href="/work">Work</a>
    <a class="btn" href="/contact">Contact</a>
  </nav>
</main>
</body>
</html>
